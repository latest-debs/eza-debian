name: Ubuntu container install test

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        image: [ubuntu:jammy, ubuntu:noble, ubuntu:resolute]
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
      options: --user root
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Set suite name
        shell: bash
        run: |
          echo "SUITE=$(cut -d: -f2 <<< '${{ matrix.image }}')" >> "$GITHUB_ENV"

      - name: Install prerequisites
        shell: bash
        run: apt-get update -qq && apt-get install -y -qq curl gnupg lsb-release

      - name: Add the latest-debs apt repo
        shell: bash
        run: |
          install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://raw.githubusercontent.com/latest-debs/apt-repo/main/latest-debs.asc \
            | gpg --dearmor --yes -o /etc/apt/keyrings/latest-debs.gpg
          echo "deb [signed-by=/etc/apt/keyrings/latest-debs.gpg] https://latest-debs.ranjithraj.workers.dev/ $SUITE main" \
            > /etc/apt/sources.list.d/latest-debs.list

      - name: apt update (signature + index check)
        shell: bash
        run: apt-get update

      - name: Install eza
        shell: bash
        run: |
          apt-get install -y eza
          eza --version | head -1
          apt policy eza
